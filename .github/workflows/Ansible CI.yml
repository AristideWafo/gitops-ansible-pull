name: Ansible CI

on:
    push:
        branches:
            - prod
            - "feat/**"
            - "fix/**"
        paths:
            - "ansible/**"
            - ".github/workflows/Ansible CI.yml"
    pull_request:
        branches:
            - prod
        paths:
            - "ansible/**"

env:
    ANSIBLE_VERSION: "10.7.0"

permissions:
    contents: read
    pull-requests: write

jobs:
    lint:
        name: Lint & Syntax
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ansible

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install toolchain
              run: |
                  pip install ansible==${{ env.ANSIBLE_VERSION }}
                  pip install ansible-lint yamllint

            - name: YAML lint
              run: yamllint .
              continue-on-error: true

            - name: Ansible lint
              run: ansible-lint playbooks/site.yml
              continue-on-error: true

            - name: Syntax check
              run: ansible-playbook playbooks/site.yml --syntax-check -i localhost,

    dry-run:
        name: Check Mode
        runs-on: ubuntu-latest
        needs: lint
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/prod')
        defaults:
            run:
                working-directory: ansible

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Ansible
              run: pip install ansible==${{ env.ANSIBLE_VERSION }}

            - name: Ansible check mode (Obs role)
              run: ansible-playbook playbooks/site.yml --check -i localhost, -e "instance_role=Obs"
