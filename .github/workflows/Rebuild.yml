name: Rebuild Compute Instances

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tapez "rebuild" pour confirmer la destruction et recréation des instances.'
        required: true
        default: 'no'

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

permissions:
  id-token: write
  contents: read

jobs:
  rebuild:
    name: Terraform Destroy & Apply
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'rebuild'
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Rebuild

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Destroy Instances
        id: destroy
        run: terraform destroy -target=module.compute.aws_instance.web -auto-approve

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve