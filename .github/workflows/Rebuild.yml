name: Manage Compute Instances

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action à effectuer: "start" (créer), "destroy" (détruire), "rebuild" (recréer)'
        required: true
        type: choice
        options:
          - start
          - destroy
          - rebuild

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

permissions:
  id-token: write
  contents: read

jobs:
  start:
    name: Terraform Apply - Créer les instances
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'start'
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Start

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve

  destroy:
    name: Terraform Destroy - Détruire les instances
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'destroy'
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Destroy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Destroy Instances
        id: destroy
        run: terraform destroy -target=module.compute.aws_instance.web -auto-approve

  rebuild:
    name: Terraform Rebuild - Recréer les instances
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'rebuild'
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Rebuild

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Destroy Instances
        id: destroy
        run: terraform destroy -target=module.compute.aws_instance.web -auto-approve

      - name: Terraform Apply
        id: apply
        run: terraform apply -auto-approve